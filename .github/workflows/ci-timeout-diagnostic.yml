name: One-time CI timeout diagnostics

on:
  push:
    branches: [diagnose-ci-44775922415]

permissions:
  actions: read
  contents: read

jobs:
  retrieve-owned-job-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate run identity and retrieve its timed-out job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = 'ehpc/ehpc.io-audio'
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/44775922415/attempts/1" --output "$RUNNER_TEMP/run.json"
          jq -e '.id == 44775922415 and .run_attempt == 1 and .head_sha == "23daf0150aa79828e75f931cda81d54a078885b8" and .workflow_id == 335525943 and .repository.id == 1319330182 and .head_repository.id == 1319330182 and .status == "completed" and .conclusion == "failure"' "$RUNNER_TEMP/run.json" >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/jobs/136432266662" --output "$RUNNER_TEMP/job.json"
          jq -e '.id == 136432266662 and .run_id == 44775922415 and .run_attempt == 1 and .head_sha == "23daf0150aa79828e75f931cda81d54a078885b8" and .status == "completed" and .conclusion == "failure"' "$RUNNER_TEMP/job.json" >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/jobs/136432266662/logs" --output "$RUNNER_TEMP/ci-timeout-136432266662.log"
          test -s "$RUNNER_TEMP/ci-timeout-136432266662.log"
          sha256sum "$RUNNER_TEMP/ci-timeout-136432266662.log" > "$RUNNER_TEMP/ci-timeout-136432266662.sha256"
      - name: Upload exact job log for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: ci-timeout-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-timeout-136432266662.log
            ${{ runner.temp }}/ci-timeout-136432266662.sha256
          retention-days: 1
          if-no-files-found: error
