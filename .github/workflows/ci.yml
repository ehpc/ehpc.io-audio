name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint & test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native audio tools
        run: .github/scripts/install-ci-native-tools.sh
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        # Use the latest stable minor in .python-version (also used locally).
        run: uv sync --frozen
      - name: Check native tools
        run: |
          for tool in ffmpeg ffprobe rubberband keyfinder-cli; do
            command -v "$tool"
          done
      - name: Check formatting (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (ty)
        run: uv run ty check
      - name: Run tests (pytest)
        # Excludes the Modal smoke test (needs credentials) via pyproject addopts.
        run: uv run pytest

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests (vitest)
        run: npm run test

  visual:
    name: Compare pinned Chromium visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Compare screenshots in Playwright Noble Docker runtime
        run: npm --prefix frontend run test:visual
      - name: Upload visual comparisons and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/visual/
            frontend/playwright-report/visual/
          if-no-files-found: error
          retention-days: 7

  youtube:
    name: Real YouTube CPU key analysis browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install native audio tools
        run: .github/scripts/install-ci-native-tools.sh
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up downloader JavaScript runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - name: Install frontend and Chromium
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium
      - name: Analyze real external YouTube URL in Chromium without GPU jobs
        # This explicitly external test must fail, not skip, if YouTube rejects
        # this runner (bot/auth/network). Its artifacts retain the real error.
        run: npm --prefix frontend run test:youtube
      - name: Upload real YouTube response and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/youtube/
            frontend/playwright-report/youtube/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    # Publish only after native/frontend checks, pinned visual comparisons,
    # real GPU smoke/browser E2E against the isolated app, and production promotion.
    needs: [backend, frontend, visual, youtube, deploy-modal, deploy-production]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t "$IMAGE:prod" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:prod"
          docker push "$IMAGE:${{ github.sha }}"

  deploy-modal:
    name: Deploy & test isolated Modal app
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Deploy a unique non-production app on every push and PR. Secrets are
    # required; unset/denied credentials fail visibly rather than skipping.
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_APP_NAME: audio-separator-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_MODAL_APP_NAME: audio-separator-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install native audio tools
        run: .github/scripts/install-ci-native-tools.sh
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        # Client Python follows .python-version; the remote GPU image is separate.
        run: uv sync --frozen
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium and system dependencies
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Check native tools and test app isolation
        run: |
          for tool in ffmpeg ffprobe rubberband keyfinder-cli; do
            command -v "$tool"
          done
          test -n "$E2E_MODAL_APP_NAME"
          test "$E2E_MODAL_APP_NAME" != audio-separator
          test "$MODAL_APP_NAME" = "$E2E_MODAL_APP_NAME"
      - name: Deploy isolated Modal app
        run: uv run modal deploy separator/modal_app.py --name "$MODAL_APP_NAME"
      - name: GPU smoke test (spawns deployed function)
        run: uv run pytest -m smoke
      - name: Run full-stack browser E2E
        run: npm --prefix frontend run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Modal app
        # The app may not exist if deploy failed; this cleanup must not mask the
        # original failure, and the unique app is never the production app.
        if: always()
        run: uv run modal app stop -y "$MODAL_APP_NAME" || true

  deploy-production:
    name: Promote tested Modal app to production
    runs-on: ubuntu-latest
    needs: [deploy-modal, visual, youtube]
    if: github.ref == 'refs/heads/main'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_APP_NAME: audio-separator
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Deploy production Modal app
        run: uv run modal deploy separator/modal_app.py --name "$MODAL_APP_NAME"
