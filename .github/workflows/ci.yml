name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_gpu:
        description: Run isolated GPU and live-browser validation without production promotion
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint & test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native audio tools
        run: .github/scripts/install-ci-native-tools.sh
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        # Use the latest stable minor in .python-version (also used locally).
        run: uv sync --frozen
      - name: Check native tools
        run: |
          for tool in ffmpeg ffprobe rubberband keyfinder-cli; do
            command -v "$tool"
          done
      - name: Check formatting (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (ty)
        run: uv run ty check
      - name: Run tests (pytest)
        # Excludes the Modal smoke test (needs credentials) via pyproject addopts.
        run: uv run pytest
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check backend process diagnostics
        run: node --test frontend/e2e/backend-evidence.test.mjs
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium, Firefox, and system dependencies
        run: npx --prefix frontend playwright install --with-deps chromium firefox
      - name: Check Firefox native listening clock without GPU work
        run: node frontend/e2e/run.mjs --visual --throttle-media --config=playwright.listening.config.ts
      - name: Check seeded Chromium interactions without GPU work
        run: node frontend/e2e/run.mjs --visual --config=playwright.seeded.config.ts
      - name: Check controlled song-discovery browser contracts
        run: node frontend/e2e/run.mjs --visual song-discovery.spec.ts
      - name: Check native MP3 uploads without GPU work
        run: node frontend/e2e/run.mjs --cpu mp3-upload.spec.ts
      - name: Upload CPU browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Parse every E2E spec before any release GPU work can start.
      - name: Parse-check e2e specs
        run: node_modules/.bin/esbuild e2e/*.spec.ts e2e/audio.ts --outdir=/tmp/e2e-parse-check --log-level=error
      - name: Build
        run: npm run build
      - name: Run tests (vitest)
        run: npm run test

  visual:
    name: Compare pinned Chromium visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Compare screenshots in Playwright Noble Docker runtime
        run: npm --prefix frontend run test:visual
      - name: Upload visual comparisons and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/visual/
            frontend/playwright-report/visual/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    # Publish only after native/frontend checks, pinned visual comparisons,
    # real GPU smoke/browser E2E against the isolated app, and production promotion.
    needs: [backend, frontend, visual, deploy-modal, deploy-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t "$IMAGE:prod" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:prod"
          docker push "$IMAGE:${{ github.sha }}"

  deploy-modal:
    name: Deploy & test isolated Modal app
    runs-on: ubuntu-latest
    needs: [backend, frontend, visual]
    # PRs run the CPU/browser/visual gates only. Every main push and explicitly
    # requested manual validation runs the complete isolated neural/live suite.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_gpu)
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ehpc-audio
      MODAL_APP_NAME: audio-separator-ci-${{ github.run_id }}-${{ github.run_attempt }}-l4
      E2E_MODAL_APP_NAME: audio-separator-ci-${{ github.run_id }}-${{ github.run_attempt }}-l4
      MODAL_L40S_APP_NAME: audio-separator-ci-${{ github.run_id }}-${{ github.run_attempt }}-l40s
      MODAL_TEST_GPU: L4
      MODAL_GPU_IDLE_SECONDS: ${{ vars.MODAL_GPU_IDLE_SECONDS || '60' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Install native audio tools
        run: .github/scripts/install-ci-native-tools.sh
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        # Client Python follows .python-version; the remote GPU image is separate.
        run: uv sync --frozen
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium and system dependencies
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Check native tools and test app isolation
        run: |
          for tool in ffmpeg ffprobe rubberband keyfinder-cli; do
            command -v "$tool"
          done
          test "$MODAL_ENVIRONMENT" = ehpc-audio
          test "$MODAL_APP_NAME" = "audio-separator-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-l4"
          test "$E2E_MODAL_APP_NAME" = "$MODAL_APP_NAME"
          test "$MODAL_L40S_APP_NAME" = "audio-separator-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-l40s"
          test "$MODAL_TEST_GPU" = L4
      - name: Provision verified shared model receipts before GPU work
        run: |
          echo "PREPARED_MODELS_ROOT=$RUNNER_TEMP/audio-prepared-models" >> "$GITHUB_ENV"
          uv run python -m separator.prepare_models \
            --manifest separator/model_manifest.json \
            --receipt separator/model_assets_receipt.json \
            --volume audio-separator-models \
            --environment "$MODAL_ENVIRONMENT" \
            --prepared-models-root "$RUNNER_TEMP/audio-prepared-models"
      - name: Deploy isolated L4 Modal app
        run: uv run modal deploy separator/modal_app.py --name "$MODAL_APP_NAME" --env "$MODAL_ENVIRONMENT"
      - name: Run L4 GPU smoke cases
        timeout-minutes: 30
        run: uv run pytest -x -m smoke --ignore=tests/test_structure_smoke.py --log-cli-level=INFO --basetemp="$RUNNER_TEMP/audio-gpu-smoke-l4"
      - name: Stop L4 app before production-class validation
        run: uv run modal app stop -y "$MODAL_APP_NAME" --env "$MODAL_ENVIRONMENT"
      - name: Deploy isolated L40S Modal app
        env:
          MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          E2E_MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          MODAL_TEST_GPU: L40S
        run: uv run modal deploy separator/modal_app.py --name "$MODAL_APP_NAME" --env "$MODAL_ENVIRONMENT"
      - name: Run production-class structure smoke
        timeout-minutes: 10
        env:
          MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          E2E_MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          MODAL_TEST_GPU: L40S
        run: uv run pytest -x tests/test_structure_smoke.py -m smoke --log-cli-level=INFO --basetemp="$RUNNER_TEMP/audio-gpu-smoke-l40s"
      - name: Run full-stack browser E2E on isolated L40S
        timeout-minutes: 30
        env:
          MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          E2E_MODAL_APP_NAME: ${{ env.MODAL_L40S_APP_NAME }}
          MODAL_TEST_GPU: L40S
        run: npm --prefix frontend run test:e2e
      - name: Upload E2E failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/audio-gpu-smoke-l4/**/diagnostics/**
            ${{ runner.temp }}/audio-gpu-smoke-l4/**/inference-diagnostics/**
            ${{ runner.temp }}/audio-gpu-smoke-l40s/**/diagnostics/**
            ${{ runner.temp }}/audio-gpu-smoke-l40s/**/inference-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop both isolated Modal apps
        # Either app may be absent if an earlier stage failed. Never target a
        # production app or mask the original failure during stop attempts.
        if: always()
        run: |
          for app in "$MODAL_APP_NAME" "$MODAL_L40S_APP_NAME"; do
            uv run modal app stop -y "$app" --env "$MODAL_ENVIRONMENT" || true
          done
      - name: Remove stopped isolated transport volumes
        # Failed runs retain private diagnostics for operator retrieval and
        # explicit cleanup after both owned apps are verified stopped.
        if: success()
        timeout-minutes: 3
        run: |
          uv run python - <<'PY'
          import json
          import os
          import subprocess
          import time

          from separator.inference_transport import transport_volume_name

          apps = {os.environ["MODAL_APP_NAME"], os.environ["MODAL_L40S_APP_NAME"]}
          environment = os.environ["MODAL_ENVIRONMENT"]
          prefix = f"audio-separator-ci-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          if apps != {f"{prefix}-l4", f"{prefix}-l40s"} or environment != "ehpc-audio":
              raise RuntimeError("Refusing cleanup outside these isolated CI apps")
          deadline = time.monotonic() + 60
          while True:
              rows = json.loads(subprocess.check_output(
                  ["modal", "app", "list", "--json", "--env", environment],
                  text=True, timeout=15,
              ))
              owned_apps = []
              for app in sorted(apps):
                  matches = [row for row in rows if row["description"] == app]
                  if len(matches) != 1:
                      raise RuntimeError("Owned app lifecycle is unavailable or ambiguous")
                  owned_apps.append(matches[0])
              if all(owned["state"] == "stopped" and int(owned["tasks"]) == 0 for owned in owned_apps):
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError("Owned apps have not stopped and drained")
              time.sleep(2)
          for owned in owned_apps:
              volume = transport_volume_name(owned["description"], environment)
              subprocess.run(
                  ["modal", "volume", "delete", volume, "-y", "--env", environment],
                  check=True, timeout=30,
              )
              print(json.dumps({
                  "app_id": owned["app_id"], "state": owned["state"],
                  "tasks": int(owned["tasks"]), "transport_volume": volume,
                  "deleted": True,
              }))
          PY

  deploy-production:
    name: Promote tested Modal app to production
    runs-on: ubuntu-latest
    needs: [deploy-modal, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ehpc-audio
      MODAL_APP_NAME: audio-inference-v3
      MODAL_GPU_IDLE_SECONDS: ${{ vars.MODAL_GPU_IDLE_SECONDS || '60' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Deploy production Modal app
        run: |
          test "$MODAL_ENVIRONMENT" = ehpc-audio
          test -z "${MODAL_TEST_GPU+x}"
          uv run modal deploy separator/modal_app.py --name "$MODAL_APP_NAME" --env "$MODAL_ENVIRONMENT"
