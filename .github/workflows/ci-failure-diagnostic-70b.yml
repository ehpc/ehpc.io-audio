name: One-time CI deployment failure diagnostics

on:
  push:
    branches: [diagnose-ci-43938950678]

permissions:
  actions: read

jobs:
  retrieve-owned-job-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve exact failed deployment job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/133556482672/logs" \
            --output "$RUNNER_TEMP/gpu-deploy-133556482672.log"
          test -s "$RUNNER_TEMP/gpu-deploy-133556482672.log"
      - name: Upload exact job log for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpu-deploy-133556482672.log
          retention-days: 1
          if-no-files-found: error
