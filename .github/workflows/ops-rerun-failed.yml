name: Temporary guarded failed-job rerun

on:
  push:
    branches: [diagnostic/modal-upload-46016759291]

permissions:
  actions: write
  contents: read

concurrency:
  group: audio-guarded-rerun-46016759291
  cancel-in-progress: false

jobs:
  rerun:
    if: github.repository == 'ehpc/ehpc.io-audio' && github.ref == 'refs/heads/diagnostic/modal-upload-46016759291'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard and request exactly one failed-job rerun
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/ehpc/ehpc.io-audio'
          release_sha = '1a1b5313c5d4478367a74ddd3b560f3e9dc990e9'
          control_sha = '7baa50af40e906d09ee5a6fd265c162325021eda'
          run_id = 46016759291
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'audio-guarded-rerun'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=20) as response:
                  return json.load(response)
          def original():
              return get('/actions/runs/' + str(run_id))
          def valid(run):
              return run['id'] == run_id and run['head_sha'] == release_sha and run['head_branch'] == 'main' and run['event'] == 'push' and run['status'] == 'completed' and run['conclusion'] == 'failure' and run['run_attempt'] == 1
          try:
              control = get('/actions/runs/46031381152')
              jobs = get('/actions/runs/46031381152/jobs?per_page=100')['jobs']
              if control['head_sha'] != control_sha or control['status'] != 'completed' or control['conclusion'] != 'success' or len(jobs) != 1:
                  raise RuntimeError('Mounted control run not verified')
              steps = {step['name']: step['conclusion'] for step in jobs[0]['steps']}
              if steps.get('Run isolated CPU-only mounted Volume A/B control') != 'success' or steps.get('Stop owned app and delete owned diagnostic Volume') != 'success':
                  raise RuntimeError('Mounted control or cleanup not successful')
              if not valid(original()):
                  raise RuntimeError('Original run is not the exact completed failure')
              candidates = get('/actions/runs?head_sha=' + release_sha + '&event=push&per_page=100')['workflow_runs']
              if any(run['status'] != 'completed' for run in candidates):
                  raise RuntimeError('An exact-SHA push run is still active')
              if get('/git/ref/heads/main')['object']['sha'] != release_sha:
                  raise RuntimeError('Main changed')
              if not valid(original()):
                  raise RuntimeError('Original run changed during guard')
          except Exception as error:
              print(json.dumps({'phase': 'guard', 'exception_class': type(error).__name__, 'http_status': getattr(error, 'code', None)}))
              sys.exit(1)
          request = urllib.request.Request(base + '/actions/runs/' + str(run_id) + '/rerun-failed-jobs', data=b'{"enable_debug_logging":false}', headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
              print(json.dumps({'phase': 'post', 'http_status': status, 'run_id': run_id}))
              if status != 201:
                  sys.exit(1)
          except urllib.error.HTTPError as error:
              print(json.dumps({'phase': 'post', 'http_status': error.code, 'run_id': run_id}))
              sys.exit(1)
          except Exception as error:
              print(json.dumps({'phase': 'post_uncertain', 'exception_class': type(error).__name__, 'run_id': run_id}))
              try:
                  observed = original()
                  print(json.dumps({'phase': 'observe', 'attempt': observed.get('run_attempt'), 'status': observed.get('status')}))
                  if observed.get('run_attempt', 0) >= 2 and observed.get('head_sha') == release_sha:
                      sys.exit(0)
              except Exception as observed_error:
                  print(json.dumps({'phase': 'observe', 'exception_class': type(observed_error).__name__}))
              sys.exit(1)
          PY
