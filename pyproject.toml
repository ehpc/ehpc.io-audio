[project]
name = "vocals-tools"
version = "0.1.0"
description = "Tools for vocal separation via Modal."
requires-python = ">=3.15,<3.16"
dependencies = [
    "modal>=1.6.2",
    "fastapi",
    "uvicorn[standard]",
    "itsdangerous",
    "python-multipart",
    "yt-dlp>=2026.8.19",
]

[tool.ruff]
line-length = 88
# Shared separator source also runs in the separate Python 3.13 GPU image.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PLC0415",  # import-outside-toplevel
    "FURB",  # refurb — modernization
    "PERF",  # perflint
    "RUF",  # ruff-specific
]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --timeout: the SSE endpoint streams until the job ends, so a regression in the
# event bus would hang a test forever instead of failing it. Cap every test.
addopts = "-m 'not smoke' --timeout=60"
markers = [
    "smoke: opt-in tests that hit the deployed Modal app (needs auth; run via `make smoke`)",
]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before backend imports (config reads them at import time).
"tests/conftest.py" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
