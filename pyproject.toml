[project]
name = "vocals-tools"
version = "0.1.0"
description = "Tools for vocal separation via Modal."
requires-python = ">=3.13"
dependencies = [
    "modal",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PLC0415",  # import-outside-toplevel
    "FURB",  # refurb — modernization
    "PERF",  # perflint
    "RUF",  # ruff-specific
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["*.py"]
